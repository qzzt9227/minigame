<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无尽酷跑</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }
        .nav-btn.settings { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
        .nav-btn.settings:hover { background: #f59e0b; color: #08080c; }

        #gameCanvas {
            background: #090c13;
            border: 1px solid #1a2334;
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.12);
            display: block;
        }

        /* 设置弹窗 */
        .settings-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(8, 8, 12, 0.82);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .settings-dialog {
            background: #10131e;
            border: 2px solid #252e46;
            border-radius: 12px;
            width: 400px;
            max-width: 95vw;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 200, 255, 0.15);
            max-height: 90vh;
            overflow-y: auto;
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #20283e;
            padding-bottom: 10px;
        }
        .settings-title { font-size: 18px; font-weight: 700; color: #fff; }
        .settings-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
        .settings-close:hover { color: #fff; }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-label { font-size: 13px; color: #889; font-weight: 600; }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .opt-btn {
            flex: 1;
            padding: 7px 0;
            background: #181d2c;
            border: 1px solid #2c3652;
            color: #aaa;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .opt-btn:hover { color: #fff; }
        .opt-btn.active {
            background: #00c8ff;
            color: #08080c;
            border-color: #00c8ff;
            font-weight: 700;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            background: #141824;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #242c40;
        }
        .checkbox-label input { accent-color: #00c8ff; cursor: pointer; }

        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141824;
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid #242c40;
        }
        .color-name { font-size: 13px; font-weight: 600; color: #ccc; }
        .color-preview-btn {
            width: 38px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .color-preview-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
        <button class="nav-btn settings" onclick="openSettings()">⚙️ 跑酷自定义设置</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- 设置弹窗 -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-dialog">
            <div class="settings-header">
                <span class="settings-title">⚙️ 跑酷参数自定义</span>
                <button class="settings-close" onclick="closeSettings()">✕</button>
            </div>

            <!-- 生命值血条设置 -->
            <div class="setting-group">
                <div class="setting-label">最大生命值 (血条格数)</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="hp" data-val="1" onclick="setHp(1, this)">1 格 (硬核)</button>
                    <button class="opt-btn active" data-type="hp" data-val="3" onclick="setHp(3, this)">3 格 (标准 推荐)</button>
                    <button class="opt-btn" data-type="hp" data-val="5" onclick="setHp(5, this)">5 格 (休闲)</button>
                </div>
            </div>

            <!-- 无敌时间设置 -->
            <div class="setting-group">
                <div class="setting-label">受伤无敌保护时间</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="iframes" data-val="0.8" onclick="setIFrames(0.8, this)">0.8 秒 (紧凑)</button>
                    <button class="opt-btn active" data-type="iframes" data-val="1.5" onclick="setIFrames(1.5, this)">1.5 秒 (标准)</button>
                    <button class="opt-btn" data-type="iframes" data-val="2.5" onclick="setIFrames(2.5, this)">2.5 秒 (充裕)</button>
                </div>
            </div>

            <!-- 基础奔跑速度 (调慢) -->
            <div class="setting-group">
                <div class="setting-label">基础奔跑速度 (慢速调节)</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="speed" data-val="3.5" onclick="setSpeed(3.5, this)">慢速 (3.5)</button>
                    <button class="opt-btn active" data-type="speed" data-val="4.5" onclick="setSpeed(4.5, this)">适中 (4.5 推荐)</button>
                    <button class="opt-btn" data-type="speed" data-val="6.5" onclick="setSpeed(6.5, this)">极速 (6.5)</button>
                </div>
            </div>

            <!-- 障碍物密集程度 -->
            <div class="setting-group">
                <div class="setting-label">障碍物密集程度</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="density" data-val="120" onclick="setDensity(120, this)">稀疏</button>
                    <button class="opt-btn active" data-type="density" data-val="85" onclick="setDensity(85, this)">标准</button>
                    <button class="opt-btn" data-type="density" data-val="60" onclick="setDensity(60, this)">密集</button>
                    <button class="opt-btn" data-type="density" data-val="45" onclick="setDensity(45, this)">疯狂</button>
                </div>
            </div>

            <!-- 障碍物类型开关 -->
            <div class="setting-group">
                <div class="setting-label">启用障碍物类型 (勾选生效)</div>
                <div class="checkbox-grid">
                    <label class="checkbox-label"><input type="checkbox" id="chk-cactus" checked> 地面尖刺</label>
                    <label class="checkbox-label"><input type="checkbox" id="chk-double" checked> 连环双尖刺</label>
                    <label class="checkbox-label"><input type="checkbox" id="chk-drone" checked> 低空无人机</label>
                    <label class="checkbox-label"><input type="checkbox" id="chk-laser" checked> 浮空激光雷</label>
                    <label class="checkbox-label"><input type="checkbox" id="chk-wall" checked> 巨石高墙</label>
                    <label class="checkbox-label"><input type="checkbox" id="chk-saw" checked> 滚动齿轮</label>
                </div>
            </div>

            <!-- 色彩个性化 -->
            <div class="setting-group">
                <div class="setting-label">色彩自定义 (点击调色盘挑选)</div>
                <div class="color-row">
                    <span class="color-name">玩家角色颜色</span>
                    <div class="color-preview-btn" id="btnPlayerColor" style="background:#00ff9d;"></div>
                </div>
                <div class="color-row">
                    <span class="color-name">地面尖刺/障碍颜色</span>
                    <div class="color-preview-btn" id="btnGroundColor" style="background:#ef4444;"></div>
                </div>
                <div class="color-row">
                    <span class="color-name">低空飞鸟/无人机颜色</span>
                    <div class="color-preview-btn" id="btnDroneColor" style="background:#f59e0b;"></div>
                </div>
                <div class="color-row">
                    <span class="color-name">激光雷/高墙颜色</span>
                    <div class="color-preview-btn" id="btnLaserColor" style="background:#b05bf8;"></div>
                </div>
            </div>

            <button class="opt-btn active" style="padding:10px; margin-top:4px;" onclick="saveAndApplySettings()">保存并重新开始</button>
        </div>
    </div>

    <script src="../shared/touch-controller.js"></script>
    <script src="../shared/color-picker.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'jump') {
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'duck') {
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'hurt') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                }
            } catch(e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 20, 800);
            canvas.height = Math.min(window.innerHeight - 40, 420);
        }
        resize();
        window.addEventListener('resize', resize);

        const GROUND_Y = canvas.height - 50;
        const GRAVITY = 0.52;
        const INITIAL_JUMP = -7.6;
        const MAX_JUMP_HOLD_FRAMES = 15;

        // 用户配置存储
        let userConfig = {
            maxHp: 3,
            iFrames: 1.5,
            baseSpeed: 4.5,
            spawnInterval: 85,
            allowedTypes: ['cactus', 'double', 'drone', 'laser', 'wall', 'saw'],
            colors: {
                player: '#00ff9d',
                ground: '#ef4444',
                drone: '#f59e0b',
                laser: '#b05bf8'
            }
        };

        try {
            const saved = localStorage.getItem('minigame_runner_settings');
            if (saved) userConfig = Object.assign(userConfig, JSON.parse(saved));
        } catch(e) {}

        // 设置面板绑定调色盘
        ColorPicker.attach('#btnPlayerColor', {
            title: '选择玩家角色颜色',
            defaultColor: userConfig.colors.player,
            onChange: (c) => userConfig.colors.player = c
        });
        ColorPicker.attach('#btnGroundColor', {
            title: '选择地面障碍颜色',
            defaultColor: userConfig.colors.ground,
            onChange: (c) => userConfig.colors.ground = c
        });
        ColorPicker.attach('#btnDroneColor', {
            title: '选择无人机颜色',
            defaultColor: userConfig.colors.drone,
            onChange: (c) => userConfig.colors.drone = c
        });
        ColorPicker.attach('#btnLaserColor', {
            title: '选择激光/高墙颜色',
            defaultColor: userConfig.colors.laser,
            onChange: (c) => userConfig.colors.laser = c
        });

        function openSettings() {
            syncSettingsUI();
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function setHp(v, el) {
            userConfig.maxHp = v;
            highlightOpt('hp', el);
        }
        function setIFrames(v, el) {
            userConfig.iFrames = v;
            highlightOpt('iframes', el);
        }
        function setSpeed(v, el) {
            userConfig.baseSpeed = v;
            highlightOpt('speed', el);
        }
        function setDensity(v, el) {
            userConfig.spawnInterval = v;
            highlightOpt('density', el);
        }

        function highlightOpt(type, el) {
            document.querySelectorAll(`.opt-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function syncSettingsUI() {
            document.querySelectorAll('.opt-btn[data-type]').forEach(b => {
                const t = b.dataset.type;
                const v = parseFloat(b.dataset.val);
                if (t === 'hp' && userConfig.maxHp === v) b.classList.add('active');
                else if (t === 'iframes' && Math.abs(userConfig.iFrames - v) < 0.1) b.classList.add('active');
                else if (t === 'speed' && Math.abs(userConfig.baseSpeed - v) < 0.1) b.classList.add('active');
                else if (t === 'density' && userConfig.spawnInterval === v) b.classList.add('active');
                else b.classList.remove('active');
            });

            ['cactus', 'double', 'drone', 'laser', 'wall', 'saw'].forEach(id => {
                const chk = document.getElementById(`chk-${id}`);
                if (chk) chk.checked = userConfig.allowedTypes.includes(id);
            });

            document.getElementById('btnPlayerColor').style.background = userConfig.colors.player;
            document.getElementById('btnGroundColor').style.background = userConfig.colors.ground;
            document.getElementById('btnDroneColor').style.background = userConfig.colors.drone;
            document.getElementById('btnLaserColor').style.background = userConfig.colors.laser;
        }

        function saveAndApplySettings() {
            const types = [];
            if (document.getElementById('chk-cactus').checked) types.push('cactus');
            if (document.getElementById('chk-double').checked) types.push('double');
            if (document.getElementById('chk-drone').checked) types.push('drone');
            if (document.getElementById('chk-laser').checked) types.push('laser');
            if (document.getElementById('chk-wall').checked) types.push('wall');
            if (document.getElementById('chk-saw').checked) types.push('saw');

            userConfig.allowedTypes = types.length > 0 ? types : ['cactus'];
            localStorage.setItem('minigame_runner_settings', JSON.stringify(userConfig));
            closeSettings();
            resetGame();
        }

        // 玩家对象
        let player = {
            baseX: 70,
            x: 70,
            y: GROUND_Y - 40,
            w: 32,
            h: 40,
            vy: 0,
            isJumping: false,
            jumpHoldTimer: 0,
            isDucking: false
        };

        let hp = userConfig.maxHp;
        let invulnerableTimer = 0;
        let shakeTimer = 0;

        let obstacles = [];
        let particles = [];
        let speed = userConfig.baseSpeed;
        let distance = 0;
        let highScore = parseInt(localStorage.getItem('minigame_runner_hi') || '0', 10);
        let gameState = 'playing';
        let spawnTimer = 0;
        let rollAngle = 0;

        function resetGame() {
            player.x = player.baseX;
            player.y = GROUND_Y - 40;
            player.vy = 0;
            player.isJumping = false;
            player.jumpHoldTimer = 0;
            player.isDucking = false;
            hp = userConfig.maxHp;
            invulnerableTimer = 0;
            shakeTimer = 0;
            obstacles = [];
            particles = [];
            speed = userConfig.baseSpeed;
            distance = 0;
            spawnTimer = 0;
            gameState = 'playing';
        }

        const keys = {};

        function startJump() {
            if (gameState !== 'playing') return;
            if (!player.isJumping && player.y >= GROUND_Y - player.h - 4) {
                player.vy = INITIAL_JUMP;
                player.isJumping = true;
                player.jumpHoldTimer = MAX_JUMP_HOLD_FRAMES;
                playSfx('jump');
            }
        }

        function endJump() {
            if (player.isJumping) {
                player.jumpHoldTimer = 0;
                if (player.vy < -2.5) {
                    player.vy *= 0.55; // 松开时立即减速，呈现小跳
                }
            }
        }

        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            keys[e.code] = true;
            if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                startJump();
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                if (!player.isJumping) playSfx('duck');
            }
            if (e.key === 'Enter' && gameState === 'gameover') resetGame();
        });

        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            keys[e.code] = false;
            if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                endJump();
            }
        });

        function update() {
            if (gameState !== 'playing') return;

            distance += Math.floor(speed * 0.1);
            // 平滑温柔的速度递增
            speed = Math.min(10.5, userConfig.baseSpeed + distance / 600);
            rollAngle += 0.14;

            if (distance > highScore) {
                highScore = distance;
                localStorage.setItem('minigame_runner_hi', highScore);
            }

            // 无敌保护倒计时
            if (invulnerableTimer > 0) invulnerableTimer--;
            if (shakeTimer > 0) shakeTimer--;

            // 下蹲控制
            player.isDucking = (keys['ArrowDown'] || keys['s'] || keys['S']) && !player.isJumping;
            player.h = player.isDucking ? 22 : 40;

            // 长按跳跃动力学 (长按更高、更远)
            const isJumpHeld = Boolean(keys[' '] || keys['Space'] || keys['ArrowUp'] || keys['w'] || keys['W']);
            if (player.isJumping && isJumpHeld && player.jumpHoldTimer > 0) {
                player.vy -= 0.52; // 维持升力
                player.jumpHoldTimer--;
                player.x = Math.min(115, player.x + 1.2); // 蓄力飞跃，角色在空中向前滑翔拓展距离

                // 跳跃悬浮推进粒子
                if (Math.random() < 0.6) {
                    particles.push({
                        x: player.x + player.w * 0.2 + Math.random() * player.w * 0.6,
                        y: player.y + player.h,
                        vx: -speed * 0.7 - Math.random() * 2,
                        vy: 2 + Math.random() * 2,
                        life: 0.5,
                        color: '#00c8ff'
                    });
                }
            } else if (!player.isJumping) {
                // 着陆后平滑回归基础站位
                player.x += (player.baseX - player.x) * 0.12;
            }

            // 跳跃物理更新
            player.vy += GRAVITY;
            player.y += player.vy;

            if (player.y >= GROUND_Y - player.h) {
                player.y = GROUND_Y - player.h;
                player.vy = 0;
                player.isJumping = false;

                // 奔跑尘埃粒子
                if (Math.random() < 0.28) {
                    particles.push({
                        x: player.x,
                        y: GROUND_Y - 2,
                        vx: -speed * 0.5 + (Math.random() - 0.5),
                        vy: -Math.random() * 2,
                        life: 0.9,
                        color: 'rgba(255,255,255,0.2)'
                    });
                }
            }

            // 障碍物生成
            spawnTimer++;
            const dynamicInterval = Math.max(38, userConfig.spawnInterval - (speed - 4.5) * 3);
            if (spawnTimer > dynamicInterval) {
                spawnTimer = 0;
                const pool = userConfig.allowedTypes;
                const type = pool[Math.floor(Math.random() * pool.length)];

                if (type === 'cactus') {
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 36, w: 22, h: 36, type });
                } else if (type === 'double') {
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 36, w: 42, h: 36, type });
                } else if (type === 'wall') {
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 50, w: 28, h: 50, type });
                } else if (type === 'drone') {
                    // 低空无人机（必须下蹲钻过）
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 38, w: 32, h: 18, type });
                } else if (type === 'laser') {
                    // 中空浮空激光地雷
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 72, w: 26, h: 26, type });
                } else if (type === 'saw') {
                    // 地面滚动锯齿
                    obstacles.push({ x: canvas.width, y: GROUND_Y - 28, w: 28, h: 28, type });
                }
            }

            // 障碍物移动与碰撞检测 (血条与无敌机制)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= speed;

                if (player.x + player.w > obs.x + 4 &&
                    player.x + 4 < obs.x + obs.w &&
                    player.y + player.h > obs.y + 4 &&
                    player.y + 4 < obs.y + obs.h) {

                    // 无敌时间内免受伤害
                    if (invulnerableTimer <= 0) {
                        hp--;
                        shakeTimer = 10;

                        // 溅射火花粒子
                        for (let k = 0; k < 12; k++) {
                            particles.push({
                                x: player.x + player.w / 2,
                                y: player.y + player.h / 2,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 0.8,
                                color: '#ef4444'
                            });
                        }

                        if (hp <= 0) {
                            gameState = 'gameover';
                            playSfx('crash');
                        } else {
                            invulnerableTimer = Math.round(userConfig.iFrames * 60);
                            playSfx('hurt');
                        }
                    }
                }

                if (obs.x + obs.w < -20) obstacles.splice(i, 1);
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            // 受击震屏效果
            if (shakeTimer > 0) {
                const ox = (Math.random() - 0.5) * shakeTimer * 1.5;
                const oy = (Math.random() - 0.5) * shakeTimer * 1.5;
                ctx.translate(ox, oy);
            }

            ctx.fillStyle = '#090c13';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制地面
            ctx.fillStyle = '#162032';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            ctx.fillStyle = '#00c8ff';
            ctx.fillRect(0, GROUND_Y, canvas.width, 2);

            // 绘制粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1.0;

            // 绘制玩家 (无敌闪烁与护盾光环)
            const isFlicker = invulnerableTimer > 0 && Math.floor(invulnerableTimer / 4) % 2 === 0;
            if (!isFlicker) {
                ctx.fillStyle = userConfig.colors.player;
                ctx.shadowColor = userConfig.colors.player;
                ctx.shadowBlur = 8;
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.shadowBlur = 0;

                // 玩家眼睛
                ctx.fillStyle = '#08080c';
                ctx.fillRect(player.x + player.w - 8, player.y + 6, 4, 4);

                // 无敌护盾光环
                if (invulnerableTimer > 0) {
                    ctx.strokeStyle = '#00c8ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(player.x + player.w / 2, player.y + player.h / 2, Math.max(player.w, player.h) * 0.75, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // 绘制多样化障碍物
            obstacles.forEach(obs => {
                if (obs.type === 'cactus') {
                    ctx.fillStyle = userConfig.colors.ground;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                } else if (obs.type === 'double') {
                    ctx.fillStyle = userConfig.colors.ground;
                    ctx.fillRect(obs.x, obs.y, 18, obs.h);
                    ctx.fillRect(obs.x + 22, obs.y, 18, obs.h);
                } else if (obs.type === 'wall') {
                    ctx.fillStyle = userConfig.colors.laser;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillRect(obs.x + 2, obs.y + 2, obs.w - 4, 4);
                } else if (obs.type === 'drone') {
                    ctx.fillStyle = userConfig.colors.drone;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h / 2);
                    ctx.lineTo(obs.x + obs.w, obs.y);
                    ctx.lineTo(obs.x + obs.w - 8, obs.y + obs.h);
                    ctx.closePath();
                    ctx.fill();
                } else if (obs.type === 'laser') {
                    ctx.fillStyle = userConfig.colors.laser;
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w/2, obs.y + obs.h/2, obs.w/2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type === 'saw') {
                    ctx.save();
                    ctx.translate(obs.x + obs.w/2, obs.y + obs.h/2);
                    ctx.rotate(rollAngle);
                    ctx.fillStyle = userConfig.colors.ground;
                    ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                    ctx.restore();
                }
            });

            // 顶部 HUD：生命值血条与距离
            // 绘制血条格
            ctx.fillStyle = '#fff';
            ctx.font = '700 16px Rajdhani';
            ctx.textAlign = 'left';
            ctx.fillText('HP:', 20, 32);

            const heartStartX = 55;
            for (let i = 0; i < userConfig.maxHp; i++) {
                const bx = heartStartX + i * 22;
                const by = 18;
                if (i < hp) {
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 6;
                    ctx.fillRect(bx, by, 16, 16);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#262a38';
                    ctx.fillRect(bx, by, 16, 16);
                }
                ctx.strokeStyle = '#444d66';
                ctx.lineWidth = 1;
                ctx.strokeRect(bx, by, 16, 16);
            }

            // 无敌保护徽章提示
            if (invulnerableTimer > 0) {
                ctx.fillStyle = '#00c8ff';
                ctx.font = '600 14px Noto Sans SC';
                const iSec = (invulnerableTimer / 60).toFixed(1);
                ctx.fillText(`🛡️ 护盾保护中 (${iSec}s)`, heartStartX + userConfig.maxHp * 22 + 15, 31);
            }

            // 距离与纪录
            ctx.fillStyle = '#fff';
            ctx.font = '700 20px Rajdhani';
            ctx.textAlign = 'right';
            ctx.fillText(`距离: ${distance} m   |   最高: ${highScore} m`, canvas.width - 20, 32);

            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = '700 32px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = '#fff';
                ctx.font = '600 18px Rajdhani';
                ctx.fillText(`本次奔跑距离: ${distance} m`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00ff9d';
                ctx.font = '500 15px Noto Sans SC';
                ctx.fillText('点击屏幕重新起跑', canvas.width / 2, canvas.height / 2 + 45);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', () => {
            if (gameState === 'gameover') resetGame();
        });

        TouchController.init({
            buttons: [
                { id: 'jump', label: '⬆ 跳跃 (长按跳高/远)', key: ' ', code: 'Space', class: 'accent' },
                { id: 'duck', label: '⬇ 下蹲', key: 'ArrowDown', code: 'ArrowDown', class: 'secondary' }
            ]
        });

        loop();
    </script>
</body>
</html>
