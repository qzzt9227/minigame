<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 数字方块</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }

        .game-header {
            width: 360px;
            max-width: 92vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            margin-top: 30px;
        }
        .title-area h1 {
            font-size: 36px;
            font-weight: 700;
            color: #00c8ff;
            line-height: 1;
        }
        .title-area p {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }
        .scores-area {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: #14141e;
            border: 1px solid #242436;
            border-radius: 6px;
            padding: 6px 12px;
            text-align: center;
            min-width: 70px;
        }
        .score-label {
            font-size: 11px;
            color: #888;
        }
        .score-val {
            font-size: 18px;
            font-weight: 700;
            color: #00ff9d;
        }

        .board-container {
            position: relative;
            width: 360px;
            height: 360px;
            max-width: 92vw;
            max-height: 92vw;
            background: #101018;
            border: 2px solid #222234;
            border-radius: 12px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.08);
        }
        .grid-cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }
        .tile {
            position: absolute;
            width: calc((100% - 50px) / 4);
            height: calc((100% - 50px) / 4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 700;
            transition: all 0.12s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tile-2 { background: #1a2234; color: #a5b4fc; }
        .tile-4 { background: #1e293b; color: #38bdf8; }
        .tile-8 { background: #0c4a6e; color: #7dd3fc; }
        .tile-16 { background: #0369a1; color: #e0f2fe; }
        .tile-32 { background: #0f766e; color: #99f6e4; }
        .tile-64 { background: #059669; color: #a7f3d0; }
        .tile-128 { background: #d97706; color: #fef3c7; font-size: 22px; box-shadow: 0 0 12px rgba(217,119,6,0.4); }
        .tile-256 { background: #ea580c; color: #ffedd5; font-size: 22px; box-shadow: 0 0 14px rgba(234,88,12,0.4); }
        .tile-512 { background: #dc2626; color: #fee2e2; font-size: 20px; box-shadow: 0 0 16px rgba(220,38,38,0.5); }
        .tile-1024 { background: #9333ea; color: #f3e8ff; font-size: 18px; box-shadow: 0 0 18px rgba(147,51,234,0.5); }
        .tile-2048 { background: #00c8ff; color: #08080c; font-size: 18px; box-shadow: 0 0 25px rgba(0,200,255,0.7); }

        .game-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 16, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 20;
        }
        .game-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay-title {
            font-size: 32px;
            font-weight: 700;
            color: #e8652b;
        }
        .restart-btn {
            background: #00c8ff;
            color: #08080c;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .restart-btn:hover { background: #00ff9d; }

        .tips {
            margin-top: 14px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
    </div>

    <div class="game-header">
        <div class="title-area">
            <h1>2048</h1>
            <p>合并相同数字方块</p>
        </div>
        <div class="scores-area">
            <div class="score-box">
                <div class="score-label">当前得分</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">最高得分</div>
                <div class="score-val" id="bestScore">0</div>
            </div>
        </div>
    </div>

    <div class="board-container" id="board">
        <!-- 16 背景单元格 -->
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

        <div class="game-overlay" id="overlay">
            <div class="overlay-title" id="overlayTitle">游戏结束</div>
            <button class="restart-btn" onclick="initGame()">重新开始</button>
        </div>
    </div>

    <div class="tips">滑动屏幕或按方向键移动方块</div>

    <script src="../shared/touch-controller.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'merge') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'move') {
                    osc.frequency.setValueAtTime(260, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.03);
                    osc.start(now); osc.stop(now + 0.03);
                }
            } catch (e) {}
        }

        const SIZE = 4;
        let board = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('minigame_2048_hi') || '0', 10);
        document.getElementById('bestScore').textContent = bestScore;

        const boardEl = document.getElementById('board');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');

        function initGame() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
            score = 0;
            updateScore(0);
            overlay.classList.remove('active');
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateScore(delta) {
            score += delta;
            document.getElementById('score').textContent = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('minigame_2048_hi', bestScore);
                document.getElementById('bestScore').textContent = bestScore;
            }
        }

        function render() {
            // 清理旧的动态 tile 元素
            const oldTiles = boardEl.querySelectorAll('.tile');
            oldTiles.forEach(t => t.remove());

            const rect = boardEl.getBoundingClientRect();
            const padding = 10;
            const gap = 10;
            const tileSize = (boardEl.clientWidth - padding * 2 - gap * (SIZE - 1)) / SIZE;

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    if (val !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${val <= 2048 ? val : 2048}`;
                        tile.textContent = val;
                        tile.style.width = `${tileSize}px`;
                        tile.style.height = `${tileSize}px`;
                        tile.style.top = `${padding + r * (tileSize + gap)}px`;
                        tile.style.left = `${padding + c * (tileSize + gap)}px`;
                        boardEl.appendChild(tile);
                    }
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            let mergedPoints = 0;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    mergedPoints += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < SIZE) {
                arr.push(0);
            }
            return { row: arr, points: mergedPoints };
        }

        function move(dir) {
            let moved = false;
            let totalPoints = 0;

            if (dir === 'left') {
                for (let r = 0; r < SIZE; r++) {
                    const res = slide(board[r]);
                    if (res.row.join(',') !== board[r].join(',')) moved = true;
                    board[r] = res.row;
                    totalPoints += res.points;
                }
            } else if (dir === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    const reversed = [...board[r]].reverse();
                    const res = slide(reversed);
                    const back = res.row.reverse();
                    if (back.join(',') !== board[r].join(',')) moved = true;
                    board[r] = back;
                    totalPoints += res.points;
                }
            } else if (dir === 'up') {
                for (let c = 0; c < SIZE; c++) {
                    const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    const res = slide(col);
                    for (let r = 0; r < SIZE; r++) {
                        if (board[r][c] !== res.row[r]) moved = true;
                        board[r][c] = res.row[r];
                    }
                    totalPoints += res.points;
                }
            } else if (dir === 'down') {
                for (let c = 0; c < SIZE; c++) {
                    const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
                    const res = slide(col);
                    const back = res.row.reverse();
                    for (let r = 0; r < SIZE; r++) {
                        if (board[r][c] !== back[r]) moved = true;
                        board[r][c] = back[r];
                    }
                    totalPoints += res.points;
                }
            }

            if (moved) {
                if (totalPoints > 0) {
                    playSfx('merge');
                    updateScore(totalPoints);
                } else {
                    playSfx('move');
                }
                addRandomTile();
                render();
                if (checkGameOver()) {
                    overlayTitle.textContent = '没有可合并方块';
                    overlay.classList.add('active');
                }
            }
        }

        function checkGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) return false;
                    if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
                    if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
                }
            }
            return true;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
            else if (e.key === 'ArrowRight' || e.key === 'd') move('right');
            else if (e.key === 'ArrowUp' || e.key === 'w') move('up');
            else if (e.key === 'ArrowDown' || e.key === 's') move('down');
        });

        // 挂载通用触屏控制器（支持全屏滑动手势与十字方向键）
        TouchController.init({
            preset: 'dpad',
            enableSwipe: true
        });

        window.addEventListener('resize', render);
        initGame();
    </script>
</body>
</html>
