<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博星战 // CYBER SHOOTER 2077</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameCanvas {
            display: block;
            background: #060609;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.15);
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }
        #mobileControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: none;
        }
        .bomb-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(232, 101, 43, 0.25);
            border: 2px solid #e8652b;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(232, 101, 43, 0.4);
        }
        .bomb-btn:active { background: #e8652b; }
        @media (max-width: 768px) {
            #mobileControls { display: block; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobileControls">
        <button class="bomb-btn" id="bombBtn">EMP 核爆</button>
    </div>

    <script>
        // Web Audio 合成器 (免外部音频资产)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'explode') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
                    gain.gain.setValueAtTime(0.45, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch (e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth, 560);
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 状态定义
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cyber_shooter_hi') || '0', 10);
        let lives = 3;
        let bombs = 2;
        let wave = 1;
        let gameState = 'playing'; // playing, gameover

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === 'b' || e.key === 'B' || e.key === ' ') useBomb();
            if (e.key === 'Enter' && gameState === 'gameover') resetGame();
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // 触屏滑动控制
        let touchX = null, touchY = null;
        canvas.addEventListener('touchstart', e => {
            const t = e.touches[0];
            touchX = t.clientX - canvas.getBoundingClientRect().left;
            touchY = t.clientY - canvas.getBoundingClientRect().top;
        }, { passive: true });
        canvas.addEventListener('touchmove', e => {
            const t = e.touches[0];
            touchX = t.clientX - canvas.getBoundingClientRect().left;
            touchY = t.clientY - canvas.getBoundingClientRect().top;
        }, { passive: true });
        canvas.addEventListener('touchend', () => { touchX = null; touchY = null; });
        document.getElementById('bombBtn').addEventListener('click', useBomb);

        // 玩家战机
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            w: 32,
            h: 38,
            speed: 6,
            weaponLevel: 1,
            shield: 100,
            shootTimer: 0,
            invincible: 0
        };

        const bullets = [];
        const enemies = [];
        const enemyBullets = [];
        const particles = [];
        const stars = [];
        const powerups = [];

        // 背景星空
        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 3 + 1
            });
        }

        function spawnEnemy() {
            const types = ['drone', 'drone', 'scout', 'armored'];
            const type = types[Math.floor(Math.random() * types.length)];
            let w = 28, h = 28, hp = 1, speed = 2.5 + Math.random() * 1.5, color = '#ff3366';
            if (type === 'scout') { w = 24; h = 24; hp = 2; speed = 3.5; color = '#ffaa00'; }
            if (type === 'armored') { w = 40; h = 40; hp = 6; speed = 1.6; color = '#a855f7'; }

            enemies.push({
                x: Math.random() * (canvas.width - w - 20) + 10,
                y: -h,
                w, h, hp, maxHp: hp, speed, type, color,
                shootTimer: Math.random() * 60 + 30
            });
        }

        function shoot() {
            playSfx('laser');
            if (player.weaponLevel === 1) {
                bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -12, w: 3, h: 14, color: '#00c8ff' });
            } else if (player.weaponLevel === 2) {
                bullets.push({ x: player.x - 10, y: player.y - 14, vx: 0, vy: -12, w: 3, h: 14, color: '#00c8ff' });
                bullets.push({ x: player.x + 10, y: player.y - 14, vx: 0, vy: -12, w: 3, h: 14, color: '#00c8ff' });
            } else {
                bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -13, w: 4, h: 16, color: '#00ff9d' });
                bullets.push({ x: player.x - 12, y: player.y - 14, vx: -2, vy: -12, w: 3, h: 14, color: '#00c8ff' });
                bullets.push({ x: player.x + 12, y: player.y - 14, vx: 2, vy: -12, w: 3, h: 14, color: '#00c8ff' });
            }
        }

        function useBomb() {
            if (bombs <= 0 || gameState !== 'playing') return;
            bombs--;
            playSfx('bomb');
            // 全屏粒子冲击波
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18,
                    life: 1.0, color: '#e8652b', size: Math.random() * 6 + 2
                });
            }
            // 清理所有敌机与子弹
            enemies.forEach(e => {
                score += e.maxHp * 150;
                spawnExplosion(e.x + e.w/2, e.y + e.h/2, e.color, 15);
            });
            enemies.length = 0;
            enemyBullets.length = 0;
        }

        function spawnExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 0.6 + Math.random() * 0.4,
                    color: color,
                    size: Math.random() * 4 + 1
                });
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            bombs = 2;
            wave = 1;
            player.weaponLevel = 1;
            player.shield = 100;
            player.invincible = 60;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            enemies.length = 0;
            bullets.length = 0;
            enemyBullets.length = 0;
            powerups.length = 0;
            gameState = 'playing';
        }

        let frameCount = 0;

        function update() {
            if (gameState !== 'playing') return;
            frameCount++;

            // 移动控制
            if (touchX !== null) {
                player.x += (touchX - player.x) * 0.2;
                player.y += (touchY - player.y) * 0.2;
            } else {
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
                if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
                if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
                if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
            }
            player.x = Math.max(player.w/2, Math.min(canvas.width - player.w/2, player.x));
            player.y = Math.max(player.h/2, Math.min(canvas.height - player.h/2, player.y));

            // 自动开火
            player.shootTimer++;
            if (player.shootTimer >= 9) {
                shoot();
                player.shootTimer = 0;
            }
            if (player.invincible > 0) player.invincible--;

            // 生成敌机
            if (frameCount % Math.max(25, 65 - wave * 4) === 0) {
                spawnEnemy();
            }

            // 更新背景星空
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
            });

            // 更新玩家子弹
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -20) bullets.splice(i, 1);
            }

            // 更新敌机
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                // 敌机开火
                e.shootTimer--;
                if (e.shootTimer <= 0) {
                    enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h, vx: (player.x - (e.x + e.w/2)) * 0.015, vy: 4.5 });
                    e.shootTimer = 70 + Math.random() * 40;
                }

                // 子弹命中判定
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                        bullets.splice(j, 1);
                        e.hp--;
                        playSfx('hit');
                        spawnExplosion(b.x, b.y, '#00c8ff', 3);
                        if (e.hp <= 0) break;
                    }
                }

                if (e.hp <= 0) {
                    playSfx('explode');
                    score += e.maxHp * 120;
                    spawnExplosion(e.x + e.w/2, e.y + e.h/2, e.color, 16);
                    // 掉落道具概率
                    if (Math.random() < 0.22) {
                        powerups.push({
                            x: e.x + e.w/2, y: e.y + e.h/2, vy: 2,
                            type: Math.random() < 0.6 ? 'weapon' : 'shield'
                        });
                    }
                    enemies.splice(i, 1);
                    continue;
                }

                // 与玩家碰撞
                if (player.invincible <= 0 &&
                    Math.abs(player.x - (e.x + e.w/2)) < (player.w + e.w)/2 &&
                    Math.abs(player.y - (e.y + e.h/2)) < (player.h + e.h)/2) {
                    takeDamage(35);
                    enemies.splice(i, 1);
                    continue;
                }

                if (e.y > canvas.height + 40) enemies.splice(i, 1);
            }

            // 更新敌方子弹
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.x += eb.vx;
                eb.y += eb.vy;
                if (player.invincible <= 0 &&
                    Math.abs(player.x - eb.x) < 14 && Math.abs(player.y - eb.y) < 16) {
                    enemyBullets.splice(i, 1);
                    takeDamage(20);
                    continue;
                }
                if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1);
            }

            // 更新掉落物
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;
                if (Math.abs(player.x - p.x) < 24 && Math.abs(player.y - p.y) < 24) {
                    playSfx('powerup');
                    if (p.type === 'weapon') player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                    if (p.type === 'shield') player.shield = Math.min(100, player.shield + 40);
                    powerups.splice(i, 1);
                    continue;
                }
                if (p.y > canvas.height + 20) powerups.splice(i, 1);
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyber_shooter_hi', highScore);
            }
        }

        function takeDamage(val) {
            playSfx('explode');
            player.shield -= val;
            player.invincible = 35;
            spawnExplosion(player.x, player.y, '#ff4757', 10);
            if (player.shield <= 0) {
                lives--;
                player.shield = 100;
                player.weaponLevel = Math.max(1, player.weaponLevel - 1);
                if (lives <= 0) {
                    gameState = 'gameover';
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制星空
            stars.forEach(s => {
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = s.size / 2.5;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            // 绘制玩家战机
            if (gameState === 'playing') {
                ctx.save();
                ctx.translate(player.x, player.y);

                // 推进器火光
                const flameH = Math.random() * 12 + 10;
                ctx.fillStyle = '#00c8ff';
                ctx.beginPath();
                ctx.moveTo(-6, player.h/2 - 4);
                ctx.lineTo(6, player.h/2 - 4);
                ctx.lineTo(0, player.h/2 + flameH);
                ctx.fill();

                // 战机机身
                if (player.invincible % 4 < 2) {
                    ctx.fillStyle = '#181c24';
                    ctx.strokeStyle = '#00c8ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -player.h/2);
                    ctx.lineTo(player.w/2, player.h/2 - 6);
                    ctx.lineTo(0, player.h/2 - 12);
                    ctx.lineTo(-player.w/2, player.h/2 - 6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // 驾驶舱光核
                    ctx.fillStyle = '#00ff9d';
                    ctx.beginPath();
                    ctx.arc(0, -2, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // 绘制玩家子弹
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
            });
            ctx.shadowBlur = 0;

            // 绘制敌机
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x + e.w/2, e.y + e.h/2);
                ctx.fillStyle = '#14141c';
                ctx.strokeStyle = e.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, e.h/2);
                ctx.lineTo(e.w/2, -e.h/2);
                ctx.lineTo(-e.w/2, -e.h/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 血量微槽
                if (e.maxHp > 1) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(-e.w/2, -e.h/2 - 6, e.w, 3);
                    ctx.fillStyle = e.color;
                    ctx.fillRect(-e.w/2, -e.h/2 - 6, e.w * (e.hp / e.maxHp), 3);
                }
                ctx.restore();
            });

            // 绘制敌机子弹
            enemyBullets.forEach(eb => {
                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 绘制掉落物
            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'weapon' ? '#00ff9d' : '#00c8ff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#08080c';
                ctx.font = 'bold 9px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText(p.type === 'weapon' ? 'W' : 'S', p.x, p.y + 3);
            });

            // 绘制粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            // ===== 顶部 HUD =====
            ctx.fillStyle = 'rgba(10, 10, 14, 0.85)';
            ctx.fillRect(0, 0, canvas.width, 42);
            ctx.fillStyle = '#fff';
            ctx.font = '700 15px Rajdhani';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 180, 26);
            ctx.fillText(`HI: ${highScore}`, 280, 26);
            ctx.fillText(`LIVES: ${'♥ '.repeat(lives)}`, 360, 26);
            ctx.fillText(`EMP: ${bombs}`, 450, 26);

            // 护盾槽
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(canvas.width - 90, 14, 75, 12);
            ctx.fillStyle = player.shield > 30 ? '#00c8ff' : '#ff4757';
            ctx.fillRect(canvas.width - 90, 14, 75 * (player.shield / 100), 12);

            // 游戏结束画面
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e8652b';
                ctx.font = '700 36px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = '#fff';
                ctx.font = '600 20px Rajdhani';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 6);
                ctx.fillStyle = '#00c8ff';
                ctx.font = '500 16px Noto Sans SC';
                ctx.fillText('按 Enter 或轻触屏幕重新开始', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        canvas.addEventListener('click', () => {
            if (gameState === 'gameover') resetGame();
        });

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
