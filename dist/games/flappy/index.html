<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素飞翔鸟</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }
        .nav-btn.settings { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
        .nav-btn.settings:hover { background: #f59e0b; color: #08080c; }

        #gameCanvas {
            background: #0a0e17;
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.15);
            border: 1px solid #1a2233;
            display: block;
        }

        /* 设置弹窗 */
        .settings-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(8, 8, 12, 0.8);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .settings-dialog {
            background: #10131e;
            border: 2px solid #252e46;
            border-radius: 12px;
            width: 360px;
            max-width: 95vw;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 200, 255, 0.15);
            max-height: 90vh;
            overflow-y: auto;
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #20283e;
            padding-bottom: 10px;
        }
        .settings-title { font-size: 18px; font-weight: 700; color: #fff; }
        .settings-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
        .settings-close:hover { color: #fff; }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-label { font-size: 13px; color: #889; font-weight: 600; }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .opt-btn {
            flex: 1;
            padding: 7px 0;
            background: #181d2c;
            border: 1px solid #2c3652;
            color: #aaa;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .opt-btn:hover { color: #fff; }
        .opt-btn.active {
            background: #00c8ff;
            color: #08080c;
            border-color: #00c8ff;
            font-weight: 700;
        }
        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141824;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #242c40;
        }
        .color-name { font-size: 13px; font-weight: 600; color: #ccc; }
        .color-preview-btn {
            width: 38px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .color-preview-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
        <button class="nav-btn settings" onclick="openSettings()">⚙️ 难度设置</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- 设置弹窗 -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-dialog">
            <div class="settings-header">
                <span class="settings-title">⚙️ 像素飞鸟设置</span>
                <button class="settings-close" onclick="closeSettings()">✕</button>
            </div>

            <div class="setting-group">
                <div class="setting-label">飞行速度 (反应时间)</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="speed" data-val="1.3" onclick="setSpeed(1.3, this)">舒适 (1.3)</button>
                    <button class="opt-btn active" data-type="speed" data-val="1.7" onclick="setSpeed(1.7, this)">标准 (1.7)</button>
                    <button class="opt-btn" data-type="speed" data-val="2.3" onclick="setSpeed(2.3, this)">挑战 (2.3)</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">管道空隙 (穿过容错)</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="gap" data-val="185" onclick="setGap(185, this)">宽敞 (185)</button>
                    <button class="opt-btn active" data-type="gap" data-val="160" onclick="setGap(160, this)">标准 (160)</button>
                    <button class="opt-btn" data-type="gap" data-val="135" onclick="setGap(135, this)">狭窄 (135)</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">管道间距 (密集程度)</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="density" data-val="130" onclick="setDensity(130, this)">稀疏</button>
                    <button class="opt-btn active" data-type="density" data-val="110" onclick="setDensity(110, this)">标准</button>
                    <button class="opt-btn" data-type="density" data-val="85" onclick="setDensity(85, this)">密集</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">飞鸟体型大小</div>
                <div class="btn-row">
                    <button class="opt-btn" data-type="birdSize" data-val="10" onclick="setBirdSize(10, this)">轻巧</button>
                    <button class="opt-btn active" data-type="birdSize" data-val="13" onclick="setBirdSize(13, this)">标准</button>
                    <button class="opt-btn" data-type="birdSize" data-val="16" onclick="setBirdSize(16, this)">大号</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">色彩个性化 (点击调色盘)</div>
                <div class="color-row">
                    <span class="color-name">飞鸟颜色</span>
                    <div class="color-preview-btn" id="btnBirdColor" style="background:#f59e0b;"></div>
                </div>
                <div class="color-row">
                    <span class="color-name">管道颜色</span>
                    <div class="color-preview-btn" id="btnPipeColor" style="background:#10b981;"></div>
                </div>
            </div>

            <button class="opt-btn active" style="margin-top:8px; padding:10px 0;" onclick="saveAndApplySettings()">保存并重新开始</button>
        </div>
    </div>

    <script src="../shared/touch-controller.js"></script>
    <script src="../shared/color-picker.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'flap') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'point') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.07);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now); osc.stop(now + 0.16);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                }
            } catch(e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 20, 420);
            canvas.height = Math.min(window.innerHeight - 40, 640);
        }
        resize();
        window.addEventListener('resize', resize);

        // 设置参数系统
        let settings = {
            speed: 1.7,
            pipeGap: 160,
            pipeInterval: 110,
            birdRadius: 13,
            birdColor: '#f59e0b',
            pipeColor: '#10b981'
        };

        try {
            const saved = localStorage.getItem('minigame_flappy_settings');
            if (saved) settings = Object.assign(settings, JSON.parse(saved));
        } catch(e) {}

        const GRAVITY = 0.28;
        const JUMP = -5.8;
        const PIPE_WIDTH = 54;

        let bird = { x: 70, y: 250, vy: 0, radius: settings.birdRadius };
        let pipes = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('minigame_flappy_hi') || '0', 10);
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let frame = 0;

        function resetGame() {
            bird = { x: 70, y: canvas.height / 2, vy: 0, radius: settings.birdRadius };
            pipes = [];
            score = 0;
            gameState = 'playing';
            frame = 0;
        }

        function flap() {
            if (gameState === 'start' || gameState === 'gameover') {
                resetGame();
                playSfx('flap');
                return;
            }
            if (gameState === 'playing') {
                bird.vy = JUMP;
                playSfx('flap');
            }
        }

        function update() {
            if (gameState === 'playing') {
                frame++;
                bird.vy += GRAVITY;
                bird.y += bird.vy;

                // 地面与天花板碰撞
                if (bird.y + bird.radius >= canvas.height - 30 || bird.y - bird.radius <= 0) {
                    gameOver();
                }

                // 生成管道 (根据密度参数)
                if (frame % settings.pipeInterval === 0) {
                    const minTop = 60;
                    const maxTop = canvas.height - 30 - settings.pipeGap - 60;
                    const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
                    pipes.push({
                        x: canvas.width,
                        top: topHeight,
                        bottom: canvas.height - 30 - topHeight - settings.pipeGap,
                        passed: false
                    });
                }

                // 移动管道与碰撞判定
                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.x -= settings.speed;

                    // 得分判定
                    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
                        p.passed = true;
                        score++;
                        playSfx('point');
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('minigame_flappy_hi', highScore);
                        }
                    }

                    // 碰撞检测 (圆形与 AABB 盒精准相交)
                    if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
                        if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - 30 - p.bottom) {
                            gameOver();
                        }
                    }

                    if (p.x + PIPE_WIDTH < -20) {
                        pipes.splice(i, 1);
                    }
                }
            }
        }

        function gameOver() {
            gameState = 'gameover';
            playSfx('hit');
        }

        function draw() {
            ctx.fillStyle = '#0a0e17';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景微弱星星
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for (let i = 0; i < 20; i++) {
                const sx = (i * 37 + frame * 0.2) % canvas.width;
                const sy = (i * 47) % (canvas.height - 80);
                ctx.fillRect(sx, sy, 2, 2);
            }

            // 绘制管道
            pipes.forEach(p => {
                ctx.fillStyle = settings.pipeColor;
                // 上管道
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(p.x - 3, p.top - 18, PIPE_WIDTH + 6, 18);
                ctx.fillStyle = settings.pipeColor;
                ctx.fillRect(p.x - 2, p.top - 17, PIPE_WIDTH + 4, 16);

                // 下管道
                const botY = canvas.height - 30 - p.bottom;
                ctx.fillRect(p.x, botY, PIPE_WIDTH, p.bottom);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(p.x - 3, botY, PIPE_WIDTH + 6, 18);
                ctx.fillStyle = settings.pipeColor;
                ctx.fillRect(p.x - 2, botY + 1, PIPE_WIDTH + 4, 16);
            });

            // 绘制地面
            ctx.fillStyle = '#161e2e';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = '#00c8ff';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 2);

            // 绘制小鸟
            ctx.save();
            ctx.translate(bird.x, bird.y);
            const rot = Math.min(Math.PI / 3, Math.max(-Math.PI / 4, bird.vy * 0.08));
            ctx.rotate(rot);

            // 身体
            ctx.fillStyle = settings.birdColor;
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(bird.radius * 0.4, -bird.radius * 0.3, bird.radius * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(bird.radius * 0.48, -bird.radius * 0.3, bird.radius * 0.14, 0, Math.PI * 2);
            ctx.fill();

            // 嘴喙
            ctx.fillStyle = '#ea580c';
            ctx.beginPath();
            ctx.moveTo(bird.radius * 0.55, 0);
            ctx.lineTo(bird.radius * 1.15, bird.radius * 0.2);
            ctx.lineTo(bird.radius * 0.55, bird.radius * 0.4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // 顶部实时得分 HUD
            if (gameState === 'playing') {
                ctx.fillStyle = '#fff';
                ctx.font = '700 36px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText(score, canvas.width / 2, 70);
            }

            // 初始等待
            if (gameState === 'start') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00c8ff';
                ctx.font = '700 28px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('像素飞翔鸟', canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = '#fff';
                ctx.font = '500 16px Noto Sans SC';
                ctx.fillText('点击屏幕或按空格起飞', canvas.width / 2, canvas.height / 2 + 10);
            }

            // 结算画面
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = '700 32px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 45);
                ctx.fillStyle = '#fff';
                ctx.font = '600 20px Rajdhani';
                ctx.fillText(`得分: ${score}   最高: ${highScore}`, canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#00ff9d';
                ctx.font = '500 15px Noto Sans SC';
                ctx.fillText('点击屏幕重新起飞', canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => {
            if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp') flap();
        });
        canvas.addEventListener('click', flap);

        TouchController.init({
            buttons: [
                { id: 'flap', label: '🪶 飞行', key: ' ', code: 'Space', class: 'accent' }
            ]
        });

        // 弹窗与设置函数
        const modal = document.getElementById('settingsModal');
        function openSettings() {
            syncSettingsUI();
            modal.style.display = 'flex';
        }
        function closeSettings() {
            modal.style.display = 'none';
        }

        function setSpeed(v, el) {
            settings.speed = v;
            highlightOpt('speed', el);
        }
        function setGap(v, el) {
            settings.pipeGap = v;
            highlightOpt('gap', el);
        }
        function setDensity(v, el) {
            settings.pipeInterval = v;
            highlightOpt('density', el);
        }
        function setBirdSize(v, el) {
            settings.birdRadius = v;
            bird.radius = v;
            highlightOpt('birdSize', el);
        }

        function highlightOpt(type, el) {
            document.querySelectorAll(`.opt-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function syncSettingsUI() {
            document.querySelectorAll('.opt-btn[data-type]').forEach(b => {
                const t = b.dataset.type;
                const v = parseFloat(b.dataset.val);
                if (t === 'speed' && Math.abs(settings.speed - v) < 0.1) b.classList.add('active');
                else if (t === 'gap' && settings.pipeGap === v) b.classList.add('active');
                else if (t === 'density' && settings.pipeInterval === v) b.classList.add('active');
                else if (t === 'birdSize' && settings.birdRadius === v) b.classList.add('active');
                else b.classList.remove('active');
            });
            document.getElementById('btnBirdColor').style.background = settings.birdColor;
            document.getElementById('btnPipeColor').style.background = settings.pipeColor;
        }

        function saveAndApplySettings() {
            localStorage.setItem('minigame_flappy_settings', JSON.stringify(settings));
            closeSettings();
            resetGame();
        }

        // 调色盘绑定
        ColorPicker.attach('#btnBirdColor', (hex) => {
            settings.birdColor = hex;
        }, settings.birdColor);

        ColorPicker.attach('#btnPipeColor', (hex) => {
            settings.pipeColor = hex;
        }, settings.pipeColor);

        syncSettingsUI();
        loop();
    </script>
</body>
</html>
