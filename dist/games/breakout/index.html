<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹弹球 // CYBER BREAKOUT</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameCanvas {
            display: block;
            background: #06060a;
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.15);
            border: 1px solid #1a1a24;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // Web Audio 音效合成
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = 'sine') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 20, 640);
            canvas.height = Math.min(window.innerHeight - 20, 720);
        }
        resize();
        window.addEventListener('resize', () => { resize(); initBricks(); });

        let score = 0;
        let lives = 3;
        let gameState = 'ready'; // ready, playing, gameover, win
        let combo = 0;

        // 挡板
        const paddle = {
            w: 110,
            h: 14,
            x: 0,
            y: 0,
            speed: 8,
            targetX: 0
        };

        // 弹球列表 (支持多分身)
        let balls = [];
        let bricks = [];
        let particles = [];
        let powerups = [];

        function initBricks() {
            bricks = [];
            const rows = 6;
            const cols = 8;
            const padding = 8;
            const topOffset = 80;
            const brickWidth = (canvas.width - padding * (cols + 1)) / cols;
            const brickHeight = 22;

            const colors = ['#ff3366', '#e8652b', '#f8c02a', '#00ff9d', '#00c8ff', '#b05bf8'];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = padding + c * (brickWidth + padding);
                    const y = topOffset + r * (brickHeight + padding);
                    const hp = (r === 0 || r === 1) ? 2 : 1;
                    bricks.push({
                        x, y, w: brickWidth, h: brickHeight,
                        color: colors[r % colors.length],
                        hp, maxHp: hp
                    });
                }
            }
        }

        function resetRound() {
            paddle.w = 110;
            paddle.y = canvas.height - 40;
            paddle.x = canvas.width / 2 - paddle.w / 2;
            paddle.targetX = paddle.x;

            balls = [{
                x: canvas.width / 2,
                y: paddle.y - 12,
                radius: 7,
                vx: (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 2),
                vy: -6,
                color: '#00c8ff',
                trail: []
            }];
            gameState = 'ready';
        }

        function initBricksAndRound() {
            initBricks();
            resetRound();
        }
        initBricksAndRound();

        // 控制逻辑 (鼠标与触屏)
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.targetX = mouseX - paddle.w / 2;
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            paddle.targetX = touchX - paddle.w / 2;
        }, { passive: false });

        window.addEventListener('click', () => {
            if (gameState === 'ready') gameState = 'playing';
            else if (gameState === 'gameover' || gameState === 'win') {
                score = 0;
                lives = 3;
                initBricksAndRound();
            }
        });

        window.addEventListener('keydown', e => {
            if (e.key === ' ' && gameState === 'ready') gameState = 'playing';
            if (e.key === 'Enter' && (gameState === 'gameover' || gameState === 'win')) {
                score = 0;
                lives = 3;
                initBricksAndRound();
            }
        });

        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function update() {
            // 平滑移动挡板
            paddle.x += (paddle.targetX - paddle.x) * 0.35;
            paddle.x = Math.max(4, Math.min(canvas.width - paddle.w - 4, paddle.x));

            if (gameState !== 'playing') {
                if (gameState === 'ready' && balls.length > 0) {
                    balls[0].x = paddle.x + paddle.w / 2;
                    balls[0].y = paddle.y - balls[0].radius - 2;
                }
                return;
            }

            // 更新弹球
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.trail.unshift({ x: b.x, y: b.y });
                if (b.trail.length > 8) b.trail.pop();

                b.x += b.vx;
                b.y += b.vy;

                // 墙体碰撞
                if (b.x - b.radius < 0) { b.x = b.radius; b.vx = Math.abs(b.vx); playTone(400, 0.05); }
                if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.vx = -Math.abs(b.vx); playTone(400, 0.05); }
                if (b.y - b.radius < 0) { b.y = b.radius; b.vy = Math.abs(b.vy); playTone(400, 0.05); }

                // 挡板碰撞
                if (b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.h &&
                    b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
                    b.vy = -Math.abs(b.vy);
                    // 依照击球位置赋予偏角速度
                    const hitOffset = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                    b.vx = hitOffset * 7;
                    combo = 0;
                    playTone(600, 0.08, 'triangle');
                    spawnParticles(b.x, paddle.y, '#00c8ff', 6);
                }

                // 砖块碰撞
                for (let j = bricks.length - 1; j >= 0; j--) {
                    const br = bricks[j];
                    if (b.x + b.radius > br.x && b.x - b.radius < br.x + br.w &&
                        b.y + b.radius > br.y && b.y - b.radius < br.y + br.h) {

                        // 反弹
                        const prevX = b.x - b.vx;
                        if (prevX < br.x || prevX > br.x + br.w) b.vx = -b.vx;
                        else b.vy = -b.vy;

                        br.hp--;
                        combo++;
                        score += 100 * combo;
                        playTone(700 + combo * 50, 0.08, 'square');
                        spawnParticles(b.x, b.y, br.color, 12);

                        // 道具掉落
                        if (br.hp <= 0) {
                            if (Math.random() < 0.25) {
                                powerups.push({
                                    x: br.x + br.w / 2,
                                    y: br.y + br.h,
                                    type: Math.random() < 0.5 ? 'multiball' : 'expand',
                                    vy: 2.2
                                });
                            }
                            bricks.splice(j, 1);
                        }
                        break;
                    }
                }

                // 掉出底边
                if (b.y - b.radius > canvas.height) {
                    balls.splice(i, 1);
                }
            }

            // 全部球掉落
            if (balls.length === 0) {
                lives--;
                playTone(180, 0.35, 'sawtooth');
                if (lives <= 0) {
                    gameState = 'gameover';
                } else {
                    resetRound();
                }
            }

            // 清屏获胜
            if (bricks.length === 0) {
                gameState = 'win';
                playTone(950, 0.5, 'sine');
            }

            // 更新掉落物
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;

                if (p.y >= paddle.y && p.y <= paddle.y + paddle.h &&
                    p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
                    playTone(850, 0.15);
                    if (p.type === 'multiball') {
                        // 分裂出两颗新球
                        const src = balls[0] || { x: paddle.x + paddle.w/2, y: paddle.y - 10, color: '#00c8ff' };
                        balls.push({ x: src.x, y: src.y, radius: 7, vx: -5, vy: -5, color: '#00ff9d', trail: [] });
                        balls.push({ x: src.x, y: src.y, radius: 7, vx: 5, vy: -5, color: '#ff3366', trail: [] });
                    } else if (p.type === 'expand') {
                        paddle.w = Math.min(180, paddle.w + 30);
                    }
                    powerups.splice(i, 1);
                    continue;
                }
                if (p.y > canvas.height + 20) powerups.splice(i, 1);
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const pr = particles[i];
                pr.x += pr.vx;
                pr.y += pr.vy;
                pr.life -= 0.03;
                if (pr.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制砖块
            bricks.forEach(br => {
                ctx.fillStyle = br.hp > 1 ? br.color : 'rgba(255,255,255,0.06)';
                ctx.strokeStyle = br.color;
                ctx.lineWidth = 1.5;
                ctx.fillRect(br.x, br.y, br.w, br.h);
                ctx.strokeRect(br.x, br.y, br.w, br.h);
            });

            // 绘制掉落物
            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'multiball' ? '#00ff9d' : '#e8652b';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#06060a';
                ctx.font = 'bold 10px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText(p.type === 'multiball' ? '3X' : 'EXP', p.x, p.y + 3);
            });

            // 绘制粒子
            particles.forEach(pr => {
                ctx.fillStyle = pr.color;
                ctx.globalAlpha = pr.life;
                ctx.fillRect(pr.x, pr.y, pr.size, pr.size);
            });
            ctx.globalAlpha = 1.0;

            // 绘制挡板
            ctx.fillStyle = '#00c8ff';
            ctx.shadowColor = '#00c8ff';
            ctx.shadowBlur = 12;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            // 绘制弹球与尾焰
            balls.forEach(b => {
                b.trail.forEach((t, idx) => {
                    ctx.fillStyle = b.color;
                    ctx.globalAlpha = (1 - idx / b.trail.length) * 0.35;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, b.radius * (1 - idx * 0.08), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // ===== 顶部 HUD =====
            ctx.fillStyle = 'rgba(12, 12, 18, 0.85)';
            ctx.fillRect(0, 0, canvas.width, 42);
            ctx.fillStyle = '#fff';
            ctx.font = '700 16px Rajdhani';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 190, 26);
            ctx.fillText(`COMBO: x${combo}`, 340, 26);
            ctx.fillText(`BALLS: ${'● '.repeat(lives)}`, 450, 26);

            // 状态提示
            if (gameState === 'ready') {
                ctx.fillStyle = '#00c8ff';
                ctx.font = '600 20px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('点击或按空格发球', canvas.width / 2, canvas.height / 2 + 50);
            } else if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3366';
                ctx.font = '700 36px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('SYSTEM OVERHEAT // 游戏结束', canvas.width / 2, canvas.height / 2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '600 20px Rajdhani';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00c8ff';
                ctx.font = '500 16px Noto Sans SC';
                ctx.fillText('点击屏幕重新挑战', canvas.width / 2, canvas.height / 2 + 55);
            } else if (gameState === 'win') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff9d';
                ctx.font = '700 36px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('MISSION COMPLETE // 完美清屏', canvas.width / 2, canvas.height / 2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '600 20px Rajdhani';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00c8ff';
                ctx.font = '500 16px Noto Sans SC';
                ctx.fillText('点击屏幕继续游戏', canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
