<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>经典贪吃蛇</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameCanvas {
            display: block;
            background: #06060a;
            box-shadow: 0 0 35px rgba(0, 255, 157, 0.15);
            border: 1px solid #1a2e24;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00ff9d;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00ff9d; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }
        
        /* 移动端虚拟方向键 */
        #dpad {
            margin-top: 16px;
            display: none;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px);
            gap: 8px;
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 157, 0.3);
            color: #00ff9d;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .dpad-btn:active { background: #00ff9d; color: #06060a; }
        @media (max-width: 768px) {
            #dpad { display: grid; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="dpad">
        <div></div>
        <button class="dpad-btn" data-dir="UP">▲</button>
        <div></div>
        <button class="dpad-btn" data-dir="LEFT">◀</button>
        <div></div>
        <button class="dpad-btn" data-dir="RIGHT">▶</button>
        <div></div>
        <button class="dpad-btn" data-dir="DOWN">▼</button>
        <div></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, dur, type = 'sine') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + dur);
            } catch(e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        let GRID_COUNT = 24;

        function resize() {
            const size = Math.min(window.innerWidth - 24, window.innerHeight - 180, 520);
            GRID_COUNT = Math.floor(size / GRID_SIZE);
            canvas.width = GRID_COUNT * GRID_SIZE;
            canvas.height = GRID_COUNT * GRID_SIZE;
        }
        resize();

        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let food = { x: 5, y: 5, type: 'normal' };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cyber_snake_hi') || '0', 10);
        let gameState = 'playing'; // playing, gameover
        let speed = 100;
        let lastMove = 0;
        let particles = [];

        function resetGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            spawnFood();
            gameState = 'playing';
        }
        resetGame();

        function spawnFood() {
            while (true) {
                const x = Math.floor(Math.random() * GRID_COUNT);
                const y = Math.floor(Math.random() * GRID_COUNT);
                const onSnake = snake.some(s => s.x === x && s.y === y);
                if (!onSnake) {
                    food = {
                        x, y,
                        type: Math.random() < 0.25 ? 'special' : 'normal'
                    };
                    break;
                }
            }
        }

        function setDirection(newX, newY) {
            if (newX !== -dir.x && newY !== -dir.y) {
                nextDir = { x: newX, y: newY };
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection(0, -1);
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection(0, 1);
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection(-1, 0);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection(1, 0);
            if (e.key === 'Enter' && gameState === 'gameover') resetGame();
        });

        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const d = btn.dataset.dir;
                if (d === 'UP') setDirection(0, -1);
                if (d === 'DOWN') setDirection(0, 1);
                if (d === 'LEFT') setDirection(-1, 0);
                if (d === 'RIGHT') setDirection(1, 0);
            }, { passive: false });
        });

        canvas.addEventListener('click', () => {
            if (gameState === 'gameover') resetGame();
        });

        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x * GRID_SIZE + GRID_SIZE/2,
                    y: y * GRID_SIZE + GRID_SIZE/2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    color
                });
            }
        }

        function update(timestamp) {
            if (gameState !== 'playing') return;

            if (timestamp - lastMove > speed) {
                lastMove = timestamp;
                dir = nextDir;
                const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

                // 穿墙环绕
                if (head.x < 0) head.x = GRID_COUNT - 1;
                else if (head.x >= GRID_COUNT) head.x = 0;
                if (head.y < 0) head.y = GRID_COUNT - 1;
                else if (head.y >= GRID_COUNT) head.y = 0;

                // 自身碰撞检测
                if (snake.some(s => s.x === head.x && s.y === head.y)) {
                    playTone(130, 0.4, 'sawtooth');
                    spawnParticles(head.x, head.y, '#ff3366', 25);
                    gameState = 'gameover';
                    return;
                }

                snake.unshift(head);

                // 吃到食物
                if (head.x === food.x && head.y === food.y) {
                    const addScore = food.type === 'special' ? 250 : 100;
                    score += addScore;
                    playTone(food.type === 'special' ? 880 : 660, 0.1, 'triangle');
                    spawnParticles(food.x, food.y, food.type === 'special' ? '#f8c02a' : '#00ff9d', 14);
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('cyber_snake_hi', highScore);
                    }
                    spawnFood();
                } else {
                    snake.pop();
                }
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制网格背景
            ctx.strokeStyle = 'rgba(0, 255, 157, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // 绘制食物
            const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
            const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.fillStyle = food.type === 'special' ? '#f8c02a' : '#00ff9d';
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(fx, fy, GRID_SIZE / 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 绘制蛇身
            snake.forEach((s, idx) => {
                const isHead = idx === 0;
                ctx.fillStyle = isHead ? '#00ff9d' : 'rgba(0, 255, 157, ' + Math.max(0.25, (1 - idx / snake.length)) + ')';
                ctx.fillRect(s.x * GRID_SIZE + 1, s.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);

                if (isHead) {
                    ctx.fillStyle = '#06060a';
                    ctx.fillRect(s.x * GRID_SIZE + 4, s.y * GRID_SIZE + 4, 3, 3);
                }
            });

            // 绘制粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1.0;

            // 绘制 HUD 状态
            ctx.fillStyle = '#fff';
            ctx.font = '700 15px Rajdhani';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 180, 24);
            ctx.fillText(`HI: ${highScore}`, 280, 24);
            ctx.fillText(`LENGTH: ${snake.length}`, 360, 24);

            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3366';
                ctx.font = '700 32px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '600 18px Rajdhani';
                ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillStyle = '#00ff9d';
                ctx.font = '500 15px Noto Sans SC';
                ctx.fillText('点击屏幕或按 Enter 重新开始', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function loop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
