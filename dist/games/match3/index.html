<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝石消除</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #08080c;
            color: #fff;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .top-nav {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid #333;
            color: #00c8ff;
            padding: 8px 16px;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #00c8ff; color: #08080c; }
        .nav-btn.secondary { color: #888; }
        .nav-btn.secondary:hover { background: #333; color: #fff; }

        .game-header {
            width: 380px;
            max-width: 92vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 35px;
        }
        .score-box {
            background: #121420;
            border: 1px solid #202638;
            padding: 6px 14px;
            border-radius: 6px;
            text-align: center;
        }
        .score-label { font-size: 11px; color: #888; }
        .score-val { font-size: 20px; font-weight: 700; color: #00c8ff; }

        #boardCanvas {
            background: #0d0f18;
            border: 2px solid #20263c;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0, 200, 255, 0.1);
            display: block;
            touch-action: none;
        }
        .tips {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn">← 游戏大厅</a>
        <a href="../../index.html" class="nav-btn secondary">⌂ 导航中枢</a>
    </div>

    <div class="game-header">
        <div class="score-box">
            <div class="score-label">当前得分</div>
            <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">剩余时间</div>
            <div class="score-val" id="timer" style="color:#f59e0b">60s</div>
        </div>
        <div class="score-box">
            <div class="score-label">最高纪录</div>
            <div class="score-val" id="hiScore" style="color:#00ff9d">0</div>
        </div>
    </div>

    <canvas id="boardCanvas"></canvas>
    <div class="tips">点击或滑动两个相邻宝石进行交换消除</div>

    <script src="../shared/touch-controller.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'swap') {
                    osc.frequency.setValueAtTime(320, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                } else if (type === 'match') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'over') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');

        const GRID = 8;
        let CELL_SIZE = 45;

        function resize() {
            const maxDim = Math.min(window.innerWidth - 24, 380);
            CELL_SIZE = Math.floor(maxDim / GRID);
            canvas.width = CELL_SIZE * GRID;
            canvas.height = CELL_SIZE * GRID;
        }
        resize();
        window.addEventListener('resize', resize);

        const GEMS = [
            { id: 0, color: '#ef4444', shape: 'circle' },   // 红
            { id: 1, color: '#3b82f6', shape: 'square' },   // 蓝
            { id: 2, color: '#10b981', shape: 'diamond' },  // 绿
            { id: 3, color: '#f59e0b', shape: 'triangle' }, // 黄
            { id: 4, color: '#a855f7', shape: 'hexagon' }   // 紫
        ];

        let board = [];
        let particles = [];
        let floatingTexts = [];
        let selected = null;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let isProcessing = false;
        let comboCount = 0;
        let highScore = parseInt(localStorage.getItem('minigame_match3_hi') || '0', 10);
        document.getElementById('hiScore').textContent = highScore;

        function createGem(id, r, c, fromTop = false) {
            const targetX = c * CELL_SIZE;
            const targetY = r * CELL_SIZE;
            return {
                id,
                r, c,
                renderX: targetX,
                renderY: fromTop ? -CELL_SIZE * (Math.random() * 2 + 1) : targetY,
                targetX,
                targetY,
                scale: 1.0,
                alpha: 1.0,
                isRemoving: false
            };
        }

        function initGame() {
            board = [];
            particles = [];
            floatingTexts = [];
            score = 0;
            timeLeft = 60;
            selected = null;
            isProcessing = false;
            comboCount = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60s';

            for (let r = 0; r < GRID; r++) {
                board[r] = [];
                for (let c = 0; c < GRID; c++) {
                    const id = randomGemWithoutMatch(r, c);
                    board[r][c] = createGem(id, r, c, false);
                }
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSfx('over');
                }
            }, 1000);
        }

        function randomGemWithoutMatch(r, c) {
            let forbidden = [];
            if (c >= 2 && board[r][c-1]?.id === board[r][c-2]?.id) forbidden.push(board[r][c-1].id);
            if (r >= 2 && board[r-1][c]?.id === board[r-2][c]?.id) forbidden.push(board[r-1][c].id);
            const allowed = [0, 1, 2, 3, 4].filter(id => !forbidden.includes(id));
            return allowed[Math.floor(Math.random() * allowed.length)];
        }

        function findMatches() {
            const matches = [];
            // 水平检测
            for (let r = 0; r < GRID; r++) {
                let matchLen = 1;
                for (let c = 0; c < GRID; c++) {
                    let isSame = c < GRID - 1 && board[r][c] && board[r][c + 1] &&
                                 board[r][c].id !== -1 && board[r][c].id === board[r][c + 1].id;
                    if (isSame) {
                        matchLen++;
                    } else {
                        if (matchLen >= 3) {
                            for (let k = 0; k < matchLen; k++) matches.push({ r, c: c - k });
                        }
                        matchLen = 1;
                    }
                }
            }
            // 垂直检测
            for (let c = 0; c < GRID; c++) {
                let matchLen = 1;
                for (let r = 0; r < GRID; r++) {
                    let isSame = r < GRID - 1 && board[r][c] && board[r + 1][c] &&
                                 board[r][c].id !== -1 && board[r][c].id === board[r + 1][c].id;
                    if (isSame) {
                        matchLen++;
                    } else {
                        if (matchLen >= 3) {
                            for (let k = 0; k < matchLen; k++) matches.push({ r: r - k, c });
                        }
                        matchLen = 1;
                    }
                }
            }
            return matches;
        }

        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color,
                    life: 1.0,
                    size: Math.random() * 4 + 2
                });
            }
        }

        async function resolveMatches() {
            isProcessing = true;
            let hadMatch = false;

            while (true) {
                const matches = findMatches();
                if (matches.length === 0) break;
                hadMatch = true;
                comboCount++;

                playSfx('match');
                const unique = new Set(matches.map(m => `${m.r},${m.c}`));
                const earned = unique.size * 30 * (comboCount > 1 ? comboCount : 1);
                score += earned;
                document.getElementById('score').textContent = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('minigame_match3_hi', highScore);
                    document.getElementById('hiScore').textContent = highScore;
                }

                // 消除动效：爆发粒子与缩放淡出
                unique.forEach(pos => {
                    const [r, c] = pos.split(',').map(Number);
                    const gem = board[r][c];
                    if (gem) {
                        const px = gem.renderX + CELL_SIZE / 2;
                        const py = gem.renderY + CELL_SIZE / 2;
                        spawnExplosion(px, py, GEMS[gem.id].color);
                        gem.isRemoving = true;
                    }
                });

                if (comboCount > 1) {
                    const firstMatch = matches[0];
                    floatingTexts.push({
                        text: `COMBO x${comboCount}!`,
                        x: firstMatch.c * CELL_SIZE + CELL_SIZE / 2,
                        y: firstMatch.r * CELL_SIZE + CELL_SIZE / 2,
                        life: 1.0,
                        color: '#00ff9d'
                    });
                }

                // 留出消除动画展示帧
                await new Promise(res => setTimeout(res, 220));

                // 物理下落重构：上层宝石更新 targetY，顶部掉落新宝石
                for (let c = 0; c < GRID; c++) {
                    let emptyRow = GRID - 1;
                    for (let r = GRID - 1; r >= 0; r--) {
                        if (board[r][c] && !board[r][c].isRemoving && board[r][c].id !== -1) {
                            const gem = board[r][c];
                            if (emptyRow !== r) {
                                gem.r = emptyRow;
                                gem.targetY = emptyRow * CELL_SIZE;
                                board[emptyRow][c] = gem;
                                board[r][c] = null;
                            }
                            emptyRow--;
                        } else {
                            board[r][c] = null;
                        }
                    }

                    // 填补上方空位
                    let dropStagger = 1;
                    for (let r = emptyRow; r >= 0; r--) {
                        const newId = Math.floor(Math.random() * GEMS.length);
                        const newGem = createGem(newId, r, c, true);
                        newGem.renderY = -CELL_SIZE * dropStagger;
                        board[r][c] = newGem;
                        dropStagger++;
                    }
                }

                await new Promise(res => setTimeout(res, 280));
            }

            comboCount = 0;
            isProcessing = false;
            return hadMatch;
        }

        async function swap(r1, c1, r2, c2) {
            isProcessing = true;
            playSfx('swap');

            const g1 = board[r1][c1];
            const g2 = board[r2][c2];

            // 交换 target 坐标展示平滑移动
            g1.targetX = c2 * CELL_SIZE;
            g1.targetY = r2 * CELL_SIZE;
            g2.targetX = c1 * CELL_SIZE;
            g2.targetY = r1 * CELL_SIZE;

            board[r1][c1] = g2;
            board[r2][c2] = g1;
            g1.r = r2; g1.c = c2;
            g2.r = r1; g2.c = c1;

            // 等待平滑移动动效到位
            await new Promise(res => setTimeout(res, 180));

            const matched = await resolveMatches();
            if (!matched) {
                // 没有匹配则动效退回
                playSfx('swap');
                g1.targetX = c1 * CELL_SIZE;
                g1.targetY = r1 * CELL_SIZE;
                g2.targetX = c2 * CELL_SIZE;
                g2.targetY = r2 * CELL_SIZE;

                board[r1][c1] = g1;
                board[r2][c2] = g2;
                g1.r = r1; g1.c = c1;
                g2.r = r2; g2.c = c2;
                await new Promise(res => setTimeout(res, 180));
            }
            isProcessing = false;
        }

        canvas.addEventListener('click', async (e) => {
            if (isProcessing || timeLeft <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const r = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            if (r < 0 || r >= GRID || c < 0 || c >= GRID) return;

            if (!selected) {
                selected = { r, c };
            } else {
                const dr = Math.abs(selected.r - r);
                const dc = Math.abs(selected.c - c);
                if (dr + dc === 1) {
                    const prev = selected;
                    selected = null;
                    await swap(prev.r, prev.c, r, c);
                } else {
                    selected = { r, c };
                }
            }
        });

        // 触屏滑动交换
        let touchStartCell = null;
        canvas.addEventListener('touchstart', e => {
            if (isProcessing || timeLeft <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.touches[0].clientX - rect.left) / CELL_SIZE);
            const r = Math.floor((e.touches[0].clientY - rect.top) / CELL_SIZE);
            if (r >= 0 && r < GRID && c >= 0 && c < GRID) {
                touchStartCell = { r, c, x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        canvas.addEventListener('touchend', async e => {
            if (!touchStartCell || isProcessing || timeLeft <= 0) return;
            const dx = e.changedTouches[0].clientX - touchStartCell.x;
            const dy = e.changedTouches[0].clientY - touchStartCell.y;
            if (Math.hypot(dx, dy) > 20) {
                let r2 = touchStartCell.r;
                let c2 = touchStartCell.c;
                if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1;
                else r2 += dy > 0 ? 1 : -1;

                if (r2 >= 0 && r2 < GRID && c2 >= 0 && c2 < GRID) {
                    await swap(touchStartCell.r, touchStartCell.c, r2, c2);
                }
            }
            touchStartCell = null;
        }, { passive: true });

        function draw() {
            ctx.fillStyle = '#0d0f18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制单元格底板与选中框
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const cx = c * CELL_SIZE;
                    const cy = r * CELL_SIZE;
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#121524' : '#151828';
                    ctx.fillRect(cx, cy, CELL_SIZE, CELL_SIZE);

                    if (selected && selected.r === r && selected.c === c) {
                        ctx.fillStyle = 'rgba(0, 200, 255, 0.25)';
                        ctx.fillRect(cx, cy, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#00c8ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(cx + 1, cy + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                    }
                }
            }

            // 绘制宝石（带平滑坐标插值与消除缩放）
            for (let r = 0; r < GRID; r++) {
                for (let c = 0; c < GRID; c++) {
                    const gem = board[r][c];
                    if (!gem) continue;

                    // 平滑插值动画
                    gem.renderX += (gem.targetX - gem.renderX) * 0.25;
                    gem.renderY += (gem.targetY - gem.renderY) * 0.25;

                    if (gem.isRemoving) {
                        gem.scale = Math.max(0, gem.scale - 0.12);
                        gem.alpha = Math.max(0, gem.alpha - 0.12);
                    }

                    if (gem.scale <= 0.01) continue;

                    const g = GEMS[gem.id];
                    const center = CELL_SIZE / 2;
                    const radius = CELL_SIZE * 0.35 * gem.scale;

                    ctx.save();
                    ctx.globalAlpha = gem.alpha;
                    ctx.translate(gem.renderX + center, gem.renderY + center);

                    ctx.fillStyle = g.color;
                    ctx.shadowColor = g.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();

                    if (g.shape === 'circle') {
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    } else if (g.shape === 'square') {
                        ctx.rect(-radius, -radius, radius * 2, radius * 2);
                    } else if (g.shape === 'diamond') {
                        ctx.moveTo(0, -radius);
                        ctx.lineTo(radius, 0);
                        ctx.lineTo(0, radius);
                        ctx.lineTo(-radius, 0);
                        ctx.closePath();
                    } else if (g.shape === 'triangle') {
                        ctx.moveTo(0, -radius);
                        ctx.lineTo(radius, radius);
                        ctx.lineTo(-radius, radius);
                        ctx.closePath();
                    } else {
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 绘制消除爆炸粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            // 绘制浮动连击字效
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.2;
                ft.life -= 0.025;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.life;
                ctx.font = '700 20px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1.0;

            // 结算画面
            if (timeLeft <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff9d';
                ctx.font = '700 32px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('时间到！', canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = '#fff';
                ctx.font = '600 20px Rajdhani';
                ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00c8ff';
                ctx.font = '500 15px Noto Sans SC';
                ctx.fillText('点击重新开始挑战', canvas.width / 2, canvas.height / 2 + 45);
            }

            requestAnimationFrame(draw);
        }

        canvas.addEventListener('click', () => {
            if (timeLeft <= 0) initGame();
        });

        TouchController.init({
            buttons: [
                { id: 'restart', label: '↻ 重来', key: 'r', code: 'KeyR', class: 'accent' }
            ],
            onAction: (action, isPressed) => {
                if (isPressed && action === 'restart') initGame();
            }
        });

        initGame();
        draw();
    </script>
</body>
</html>
